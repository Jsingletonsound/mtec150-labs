<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
<title>Pushbutton</title>
<defs>
  <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<g filter="url(#pencil)" stroke="#2f2e2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- the two legs on the far side (they bend down behind the body) -->
  <path d="M192.9 86.4 L205.6 80.5 V170 M235.2 106.2 L247.9 100.3 V190" stroke="#8d8b85" stroke-width="3" fill="none"/>
  <!-- black plastic base, with the silver edge of the metal top -->
  <path d="M66 102 L160 146 V172 L66 128 Z" fill="#3b3a37"/>
  <path d="M160 146 L254 102 V128 L160 172 Z" fill="#2c2c2a"/>
  <path d="M66 96 L160 140 V146 L66 102 Z" fill="#a9acb1"/>
  <path d="M160 140 L254 96 V102 L160 146 Z" fill="#8f9297"/>
  <!-- the silver metal top -->
  <path d="M160 52 L254 96 L160 140 L66 96 Z" fill="#d6d8dc"/>
  <path d="M100 98 L150 122" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8"/>
  <ellipse cx="160" cy="60" rx="8" ry="4.5" fill="#3b3a37" stroke-width="1.6"/><ellipse cx="237" cy="96" rx="8" ry="4.5" fill="#3b3a37" stroke-width="1.6"/><ellipse cx="160" cy="132" rx="8" ry="4.5" fill="#3b3a37" stroke-width="1.6"/><ellipse cx="83" cy="96" rx="8" ry="4.5" fill="#3b3a37" stroke-width="1.6"/>
  <!-- the round black button -->
  <path d="M130 72 V94 A30 14 0 0 0 190 94 V72 Z" fill="#2f2e2b"/>
  <ellipse cx="160" cy="72" rx="30" ry="14" fill="#4d4c48"/>
  <path d="M139 70 A22 9 0 0 1 157 63" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.85"/>
  <!-- the two legs on the near side: out, then down -->
  <path d="M89.5 126 L76.8 131.9 V192 M131.8 145.8 L119.1 151.7 V210" stroke="#8d8b85" stroke-width="3" fill="none"/>
  <path d="M262 52 Q250 70 226 84" fill="none" stroke-width="1.6"/>
<path d="M230.1 77.1 L226 84 L234 83.8" fill="none" stroke-width="1.6"/>
</g>
<g font-family="'Chalkboard SE', 'Comic Sans MS', 'Segoe Print', Noteworthy, cursive" font-size="16" fill="#2f2e2b">
<text x="236" y="42" font-size="17">silver top</text>
</g>
</svg>
