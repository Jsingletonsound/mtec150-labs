<script>
// Tells the page around this frame how tall the widget is, so the frame fits it exactly;
// follows the page's projector setting; and helps keyboard and screen-reader users.
(function () {
  function report(ready) {
    var msg = { type: 'mtec-widget', height: document.body.scrollHeight };
    if (ready) msg.ready = true;
    if (window.parent !== window) window.parent.postMessage(msg, '*');
  }
  window.addEventListener('load', function () { report(); });
  if (window.ResizeObserver) new ResizeObserver(function () { report(); }).observe(document.body);

  // Every step change: report the height, and announce the new step to screen readers.
  var counter = document.getElementById('ct'); // "K3 · Step 3 of 8"
  var title = document.getElementById('tt');
  var live = document.createElement('p');
  live.className = 'sr-only';
  live.setAttribute('aria-live', 'polite');
  document.body.appendChild(live);
  if (counter) new MutationObserver(function () {
    report();
    live.textContent = counter.textContent + '. ' + (title ? title.textContent : '');
  }).observe(counter, { childList: true, characterData: true, subtree: true });

  // "Show result" removes itself when pressed: put keyboard focus on Next, and read the result out.
  var result = document.getElementById('wy');
  var next = document.getElementById('nx');
  if (result) result.setAttribute('aria-live', 'polite');
  var controls = document.getElementById('ix');
  if (controls && next) controls.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (b && b.textContent.trim() === 'Show result') setTimeout(function () { next.focus(); }, 0);
  }, true);

  // The page tells us: projector on or off, and how tall its window is. With the projector on,
  // the board shrinks if needed so the board and the step text fit on the screen together.
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'mtec-site') return;
    var on = !!e.data.projector, root = document.documentElement;
    root.classList.toggle('projector', on);
    if (typeof e.data.dark === 'boolean') {
      root.classList.toggle('dark', e.data.dark);
      root.classList.toggle('light', !e.data.dark);
    }
    if (e.data.paper) root.style.setProperty('--bg', e.data.paper);
    var board = document.querySelector('svg');
    if (board) board.style.maxHeight = on && e.data.screenH ? Math.max(260, e.data.screenH - 470) + 'px' : '';
    report();
  });
  report(true);
})();
</script>
