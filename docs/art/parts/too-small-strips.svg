<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
<title>The too-small resistors: 10, 100 and 220</title>
<defs>
  <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<g filter="url(#pencil)" stroke="#2f2e2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- three short strips, two resistors each, held by paper tape at both ends -->
  <path d="M42 34 V150 M78 34 V150 M142 34 V150 M178 34 V150 M242 34 V150 M278 34 V150" stroke="#8d8b85" stroke-width="2.6" fill="none"/>
  <g fill="#8fb8de">
    <rect x="33" y="70" width="18" height="44" rx="8"/><rect x="69" y="70" width="18" height="44" rx="8"/>
    <rect x="133" y="70" width="18" height="44" rx="8"/><rect x="169" y="70" width="18" height="44" rx="8"/>
    <rect x="233" y="70" width="18" height="44" rx="8"/><rect x="269" y="70" width="18" height="44" rx="8"/>
  </g>
  <!-- color bands (five per resistor): 10 = brown black black gold brown,
       100 = brown black black black brown, 220 = red red black black brown -->
  <g stroke="none">
    <g fill="#7b4a26"><rect x="34" y="76" width="16" height="4"/><rect x="70" y="76" width="16" height="4"/><rect x="134" y="76" width="16" height="4"/><rect x="170" y="76" width="16" height="4"/></g>
    <g fill="#d0453e"><rect x="234" y="76" width="16" height="4"/><rect x="270" y="76" width="16" height="4"/><rect x="234" y="83" width="16" height="4"/><rect x="270" y="83" width="16" height="4"/></g>
    <g fill="#2c2c2a"><rect x="34" y="83" width="16" height="4"/><rect x="70" y="83" width="16" height="4"/><rect x="134" y="83" width="16" height="4"/><rect x="170" y="83" width="16" height="4"/>
      <rect x="34" y="90" width="16" height="4"/><rect x="70" y="90" width="16" height="4"/><rect x="134" y="90" width="16" height="4"/><rect x="170" y="90" width="16" height="4"/><rect x="234" y="90" width="16" height="4"/><rect x="270" y="90" width="16" height="4"/>
      <rect x="134" y="97" width="16" height="4"/><rect x="170" y="97" width="16" height="4"/><rect x="234" y="97" width="16" height="4"/><rect x="270" y="97" width="16" height="4"/></g>
    <g fill="#c9a227"><rect x="34" y="97" width="16" height="4"/><rect x="70" y="97" width="16" height="4"/></g>
    <g fill="#7b4a26"><rect x="34" y="106" width="16" height="4"/><rect x="70" y="106" width="16" height="4"/><rect x="134" y="106" width="16" height="4"/><rect x="170" y="106" width="16" height="4"/><rect x="234" y="106" width="16" height="4"/><rect x="270" y="106" width="16" height="4"/></g>
  </g>
  <!-- paper tape, top and bottom of each strip -->
  <g fill="#fbf1d2" opacity="0.95">
    <path d="M22 24 H98 L97 44 H23 Z"/><path d="M122 24 H198 L197 44 H123 Z"/><path d="M222 24 H298 L297 44 H223 Z"/>
    <path d="M22 140 H98 L97 158 H23 Z"/><path d="M122 140 H198 L197 158 H123 Z"/><path d="M222 140 H298 L297 158 H223 Z"/>
  </g>
  <!-- a paper label hanging under each strip -->
  <g fill="#ffffff">
    <path d="M34 168 H86 V204 H34 Z"/><path d="M134 168 H186 V204 H134 Z"/><path d="M234 168 H286 V204 H234 Z"/>
  </g>
  <path d="M48 158 V168 M72 158 V168 M148 158 V168 M172 158 V168 M248 158 V168 M272 158 V168" fill="none" stroke-width="1.6"/>
</g>
<g font-family="'Chalkboard SE', 'Comic Sans MS', 'Segoe Print', Noteworthy, cursive" fill="#2f2e2b" font-size="21" text-anchor="middle">
  <text x="60" y="194">10</text>
  <text x="160" y="194">100</text>
  <text x="260" y="194">220</text>
</g>
</svg>
