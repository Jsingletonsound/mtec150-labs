<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
<title>Ceramic capacitors</title>
<defs>
  <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="31" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<g filter="url(#pencil)" stroke="#2f2e2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- disc one, turned a little -->
  <g transform="rotate(-7 70 202)">
    <path d="M61.2 88 V202 M78.8 88 V202" stroke="#8d8b85" stroke-width="2.8" fill="none"/>
    <ellipse cx="65" cy="89" rx="23.2" ry="29" fill="#8f5a2c"/>
    <ellipse cx="70" cy="88" rx="23.2" ry="29" fill="#b9763b"/>
    <path d="M53.3 82.2 A18.1 22.6 0 0 1 64.4 67.7" stroke="#ffffff" stroke-width="3.2" fill="none" opacity="0.85"/>
  </g>
  <!-- disc two, facing us -->
  <g transform="rotate(0 160 204)">
    <path d="M149 78 V204 M171 78 V204" stroke="#8d8b85" stroke-width="2.8" fill="none"/>
    <ellipse cx="163.5" cy="79.5" rx="30" ry="30" fill="#8f5a2c"/>
    <ellipse cx="160" cy="78" rx="30" ry="30" fill="#b9763b"/>
    <path d="M138.4 72 A23.4 23.4 0 0 1 152.8 57" stroke="#ffffff" stroke-width="3.2" fill="none" opacity="0.85"/>
  </g>
  <!-- disc three, turned the other way -->
  <g transform="rotate(7 250 202)">
    <path d="M241.2 88 V202 M258.8 88 V202" stroke="#8d8b85" stroke-width="2.8" fill="none"/>
    <ellipse cx="255" cy="89" rx="23.2" ry="29" fill="#8f5a2c"/>
    <ellipse cx="250" cy="88" rx="23.2" ry="29" fill="#b9763b"/>
    <path d="M233.3 82.2 A18.1 22.6 0 0 1 244.4 67.7" stroke="#ffffff" stroke-width="3.2" fill="none" opacity="0.85"/>
  </g>
</g>
</svg>
