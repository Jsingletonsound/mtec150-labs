<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
<title>Resistor strip</title>
<defs>
  <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<g filter="url(#pencil)" stroke="#2f2e2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- legs, held by paper tape at both ends -->
  <path d="M110 40 V186 M150 40 V186 M190 40 V186 M230 40 V186 M270 40 V186" stroke="#8d8b85" stroke-width="2.6" fill="none"/>
  <!-- the tiny blue bodies, with their color bands -->
  <g fill="#8fb8de">
    <rect x="101" y="88" width="18" height="48" rx="8"/>
    <rect x="141" y="88" width="18" height="48" rx="8"/>
    <rect x="181" y="88" width="18" height="48" rx="8"/>
    <rect x="221" y="88" width="18" height="48" rx="8"/>
    <rect x="261" y="88" width="18" height="48" rx="8"/>
  </g>
  <g stroke="none">
    <g fill="#7b4a26"><rect x="102" y="95" width="16" height="4"/><rect x="142" y="95" width="16" height="4"/><rect x="182" y="95" width="16" height="4"/><rect x="222" y="95" width="16" height="4"/><rect x="262" y="95" width="16" height="4"/></g>
    <g fill="#2c2c2a"><rect x="102" y="102" width="16" height="4"/><rect x="142" y="102" width="16" height="4"/><rect x="182" y="102" width="16" height="4"/><rect x="222" y="102" width="16" height="4"/><rect x="262" y="102" width="16" height="4"/></g>
    <g fill="#2c2c2a"><rect x="102" y="109" width="16" height="4"/><rect x="142" y="109" width="16" height="4"/><rect x="182" y="109" width="16" height="4"/><rect x="222" y="109" width="16" height="4"/><rect x="262" y="109" width="16" height="4"/></g>
    <g fill="#7b4a26"><rect x="102" y="116" width="16" height="4"/><rect x="142" y="116" width="16" height="4"/><rect x="182" y="116" width="16" height="4"/><rect x="222" y="116" width="16" height="4"/><rect x="262" y="116" width="16" height="4"/></g>
    <g fill="#3b9e4a"><rect x="102" y="126" width="16" height="4"/><rect x="142" y="126" width="16" height="4"/><rect x="182" y="126" width="16" height="4"/><rect x="222" y="126" width="16" height="4"/><rect x="262" y="126" width="16" height="4"/></g>
  </g>
  <!-- paper tape, top and bottom -->
  <path d="M20 26 H300 L298 54 H22 Z" fill="#fbf1d2" opacity="0.95"/>
  <path d="M20 172 H300 L298 196 H22 Z" fill="#fbf1d2" opacity="0.95"/>
  <path d="M30 34 L36 46 M44 32 L50 44 M286 34 L292 46" stroke="#d9c9a0" stroke-width="1.4" fill="none"/>
  <!-- the paper label -->
  <path d="M28 60 H84 V98 H28 Z" fill="#ffffff"/>
  <path d="M40 54 V60 M72 54 V60" fill="none" stroke-width="1.6"/>
</g>
<g font-family="'Chalkboard SE', 'Comic Sans MS', 'Segoe Print', Noteworthy, cursive" fill="#2f2e2b">
  <text x="56" y="87" font-size="22" text-anchor="middle">1K</text>
</g>
</svg>
