<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
<title>LED (light-emitting diode)</title>
<defs>
  <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<g filter="url(#pencil)" stroke="#2f2e2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- the red LED, big -->
  <path d="M100 116 V202" stroke="#8d8b85" stroke-width="3.2" fill="none"/>
  <path d="M120 116 V176" stroke="#8d8b85" stroke-width="3.2" fill="none"/>
  <path d="M86 114 V70 A24 24 0 0 1 134 70 V114 Z" fill="#e0483e"/>
  <rect x="80" y="110" width="60" height="11" rx="3" fill="#c23a31"/>
  <path d="M95 74 A15 15 0 0 1 108 58" stroke="#ffffff" stroke-width="3.4" fill="none" opacity="0.85"/>
  <path d="M93 96 L97 104 M99 92 L104 101" stroke="#f6a39c" stroke-width="1.6" fill="none"/>
  <!-- the other colors in the kit -->
  <g>
    <path d="M233 76 V98 M241 76 V94" stroke="#8d8b85" stroke-width="2.2" fill="none"/>
    <path d="M227 76 V56 A10 10 0 0 1 247 56 V76 Z" fill="#4a86d8"/>
    <rect x="224" y="74" width="26" height="6" rx="2" fill="#3a6fb8"/>
  </g>
  <g>
    <path d="M281 76 V98 M289 76 V94" stroke="#8d8b85" stroke-width="2.2" fill="none"/>
    <path d="M275 76 V56 A10 10 0 0 1 295 56 V76 Z" fill="#f7f6f0"/>
    <rect x="272" y="74" width="26" height="6" rx="2" fill="#e2e0d8"/>
  </g>
  <g>
    <path d="M233 148 V170 M241 148 V166" stroke="#8d8b85" stroke-width="2.2" fill="none"/>
    <path d="M227 148 V128 A10 10 0 0 1 247 128 V148 Z" fill="#4fae5c"/>
    <rect x="224" y="146" width="26" height="6" rx="2" fill="#3f9049"/>
  </g>
  <g>
    <path d="M281 148 V170 M289 148 V166" stroke="#8d8b85" stroke-width="2.2" fill="none"/>
    <path d="M275 148 V128 A10 10 0 0 1 295 128 V148 Z" fill="#f2cc3c"/>
    <rect x="272" y="146" width="26" height="6" rx="2" fill="#d9b12a"/>
  </g>
  <!-- label arrows -->
  <path d="M70 182 C78 186 86 189 95 192" fill="none" stroke-width="1.6"/>
  <path d="M88 187 L95 192 L87 195" fill="none" stroke-width="1.6"/>
  <path d="M152 186 C146 180 134 176 125 174" fill="none" stroke-width="1.6"/>
  <path d="M132 170 L125 174 L132 179" fill="none" stroke-width="1.6"/>
</g>
<g font-family="'Chalkboard SE', 'Comic Sans MS', 'Segoe Print', Noteworthy, cursive" font-size="16" fill="#2f2e2b">
  <text x="8" y="174">long leg</text>
  <text x="140" y="205">short leg</text>
</g>
</svg>
